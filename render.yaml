services:
  - type: web
    name: goldenfuture-cooperative
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: goldenfuture
      - key: SESSION_SECRET
        generateValue: true
